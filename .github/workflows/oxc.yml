name: Oxc CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  oxc-checks:
    name: Run Oxlint and Oxfmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Oxlint
        run: bun run lint

      - name: Check formatting with Oxfmt
        run: bun run format
